<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wf/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.ln{display:block;height:8px;border-radius:4px;background:var(--fill-200)}
.n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 11px/1 var(--font-mono);flex:none}
.f{display:flex;flex-direction:column;gap:6px}
.f input{height:44px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:15px var(--font-sans);background:var(--paper);color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 32px 24px; background: var(--paper); color: var(--ink); font-family: var(--font-sans);">
  <div style="width: 120px; height: 32px; background: var(--fill-100); border-radius: 4px;" role="img" aria-label="Nom de l'application"></div>
  <div style="display: flex; gap: 8px; align-items: center;">
    <span class="n">1</span>
    <div role="tablist" style="flex-grow: 1; display: flex; padding: 4px; background: var(--fill-100); border-radius: 8px;">
      <button type="button" role="tab" aria-selected="true" style="flex: 1; min-height: 36px; border: 0; border-radius: 4px; background: var(--paper); font: 600 13px var(--font-sans); color: var(--ink);">Connexion</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 1; min-height: 36px; border: 0; background: none; font: 600 13px var(--font-sans); color: var(--ink-muted);">Inscription</button>
    </div>
  </div>
  <div class="f"><label class="label" for="em">E-mail</label><input id="em" type="email" placeholder="nom@exemple.com"></div>
  <div class="f"><label class="label" for="pw">Mot de passe</label><input id="pw" type="password" placeholder="8 caractères minimum"></div>
  <div style="display: flex; gap: 8px; align-items: center;"><span class="n">2</span><span class="caption" style="color: var(--ink-muted); text-decoration: line-through;">Mot de passe oublié ?</span><span class="caption" style="color: var(--ink-muted);">(absent de l'API)</span></div>
  <a href="Profil.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: var(--primary); color: var(--on-primary); border-radius: 8px; font-weight: 600;">Se connecter</a>
  <div style="display: flex; gap: 8px; align-items: center; justify-content: center;"><span class="n">3</span><a href="Main.dc.html" class="body" style="text-decoration: underline;">Continuer sans compte</a></div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px dashed var(--note); border-radius: 4px;">
    <span class="annotation" style="color: var(--note);">Onglet Inscription : e-mail, mot de passe ×2, nom affiché, téléphone, ville, pays (GA par défaut)</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</html>
