<head><meta charset="utf-8"><title>Picto — aperçu</title></head>
<body>
<div id="root"></div>
<script>
  var W = window.Wf, h = React.createElement;
  var kinds = ['riz','huile','sucre','lait','sardine','eau','savon','conserve'];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'wf-row',style:{gap:18}},
