<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Couverture</title>
<style>
  body { margin: 0; background: var(--canvas); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--canvas); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .green { fill: var(--primary); } .citron { fill: var(--accent); } .teal { fill: var(--teal); } .ink { fill: var(--ink); } .soft { fill: var(--primary-soft); }
  .hole { fill: var(--canvas); }
  .txt { position: absolute; left: 40px; bottom: 40px; max-width: 420px; }
  .name { font-family: var(--font-display); font-weight: 800; font-size: 100px; line-height: .92; color: var(--ink); margin: 0; letter-spacing: -0.03em; }
  .tag { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: 16px 0 0; }
</style></head>
<body>
<div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <!-- blocks: primary 232×200 slab, accent tag 200×96, teal 136×136, ink 104×64, primary-soft 168×120 -->
  <!-- arrangement: price tags hung at staggered heights right of x=480, the green slab bleeding off the top edge -->
  <!-- pattern: the étiquette itself — left point cut at 50% height + punched hole (radius-pill), repeated as the motif; chosen because the brand is "Marché & étiquettes" -->
  <!-- steps: space-4 16px, space-6 24px gaps; radius-sm 6px on tag corners, radius-lg 20px on slab -->
  <rect class="green" x="504" y="-20" width="232" height="200" rx="20"/>
  <path class="citron" d="M560 140 h200 a6 6 0 0 1 6 6 v84 a6 6 0 0 1 -6 6 h-200 l-32 -48 z"/>
  <circle class="hole" cx="552" cy="188" r="8"/>
  <path class="teal" d="M792 40 h136 a6 6 0 0 1 6 6 v124 a6 6 0 0 1 -6 6 h-136 l-24 -68 z"/>
  <circle class="hole" cx="786" cy="108" r="7"/>
  <path class="ink" d="M808 208 h104 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-104 l-20 -32 z"/>
  <circle class="hole" cx="802" cy="240" r="5"/>
  <rect class="soft" x="600" y="252" width="168" height="120" rx="20"/>
</svg>
<div class="txt">
  <p class="name">Comparo</p>
  <p class="tag">Le bon prix, au bon endroit, avec sa preuve.</p>
</div>
</div>
</body>
</html>
