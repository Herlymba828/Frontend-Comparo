/* Cadre du prototype (hors application) */
:root{--desk:#e9eddf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0a110d}}
[data-theme="dark"]{--desk:#0a110d}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{height:100%;display:flex;gap:24px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));justify-content:center}
.nav{flex:0 0 280px;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-right:4px}
.nav h1{margin:0;font:800 26px/1 var(--font-display)}
.nav .sub{color:var(--ink-muted);font-size:13px}
.nav .grp{display:flex;flex-direction:column;gap:2px}
.nav .grp b{font:700 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:8px 10px 4px}
.nav .grp button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink)}
.nav .grp button:hover{background:var(--fill-100)}
.nav .grp button.on{background:var(--primary);color:var(--on-primary)}
.nav .grp button small{font-size:10.5px;font-weight:800;opacity:.75}
.toggles{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--paper);border-radius:14px;box-shadow:var(--shadow-1)}
.toggles label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.stage{flex:0 1 auto;display:flex;align-items:center;justify-content:center;min-width:0}
.phone{width:390px;height:min(820px,100%);background:var(--canvas);border-radius:36px;box-shadow:0 0 0 10px var(--paper),0 0 0 11px var(--line-soft),var(--shadow-2);overflow:hidden;position:relative;display:flex;flex-direction:column}
.stage.wide{flex:1 1 auto}
.stage.wide .phone{width:100%;max-width:1200px;height:100%;border-radius:18px;box-shadow:var(--shadow-2)}
.scr{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.navtoggle{display:none}
@media (max-width:900px){
  .shell{padding:0}
  .nav{position:fixed;inset:0;z-index:var(--z-overlay);background:var(--canvas);padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));transform:translateX(-100%);transition:transform var(--duration-base)}
  .nav.open{transform:none}
  .stage,.stage.wide{flex:1}
  .phone,.stage.wide .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .navtoggle{display:grid;position:fixed;right:max(8px,env(safe-area-inset-right,0px));top:calc(3px + env(safe-area-inset-top,0px));z-index:var(--z-overlay-control);min-width:56px;height:24px;padding:0 12px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);place-items:center;box-shadow:var(--shadow-1);font:800 11px var(--font-sans);opacity:.9}
}

/* App */
.t-display{font:800 30px/34px var(--font-display);margin:0;text-wrap:balance}
.t-title{font:800 20px/26px var(--font-display);margin:0}
.t-sub{font:700 16px/22px var(--font-sans)}
.t-cap{font-size:13px;line-height:18px}
.t-lab{font:700 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase}
.price{font:700 19px/22px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.price-lg{font:800 30px/32px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.huge{font:800 40px/44px var(--font-display);font-variant-numeric:tabular-nums}
.big{font:800 24px/28px var(--font-display);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.link{color:var(--teal-ink);font-weight:700;background:none;border:0;padding:0}
.hdr{display:flex;gap:var(--space-3);align-items:center;padding:14px var(--space-5)}
.back{width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-soft);display:grid;place-items:center;flex:none;border:0}
.pad{display:flex;flex-direction:column;gap:14px;padding:var(--space-1) var(--space-5) var(--space-4)}
.card{background:var(--paper);border-radius:var(--radius-card);box-shadow:inset 0 0 0 1px var(--line-soft)}
.card-lg{background:var(--paper);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--line-soft)}
.row{display:flex;gap:var(--space-3);align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.li{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) 0;border-bottom:1px solid var(--line-soft)}
.li:last-child{border-bottom:0}
.thumb{width:48px;height:48px;border-radius:var(--radius-md);background:var(--fill-100);flex:none;display:grid;place-items:center;font:800 15px var(--font-display);color:var(--ink-muted)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:7px var(--space-3);border-radius:var(--radius-pill);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-soft);font:700 12px/16px var(--font-sans);white-space:nowrap;border:0}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:var(--space-1);padding:3px 9px;border-radius:var(--radius-pill);font:700 11px/16px var(--font-sans);white-space:nowrap}
.p-good{background:var(--primary-soft);color:var(--ink)}
.p-mid{background:var(--proof-medium);color:var(--proof-medium-fg)}
.p-neu{background:var(--fill-100);color:var(--ink-muted)}
.p-bad{background:var(--paper);color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.p-out{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tag{position:relative;display:inline-flex;align-items:center;background:var(--price-best-bg);color:var(--price-best-fg);padding:var(--space-1) var(--space-3) var(--space-1) 22px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);border-radius:4px 7px 7px 4px;font:800 13px var(--font-sans);white-space:nowrap}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper)}
.tag.big-tag{font:800 26px/30px var(--font-display);padding:6px 14px 6px 26px}
.btn{display:flex;gap:var(--space-2);align-items:center;justify-content:center;min-height:52px;padding:0 var(--space-5);border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font:700 15px var(--font-sans);box-shadow:var(--shadow-2);width:100%}
.btn:disabled{background:var(--fill-100);color:var(--ink-muted);box-shadow:none;cursor:not-allowed}
.btn2{display:flex;gap:var(--space-2);align-items:center;justify-content:center;min-height:var(--target-primary);padding:0 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:700 14px var(--font-sans);width:100%}
.sm{min-height:40px;border-radius:10px;font-size:13px;box-shadow:none;width:auto}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:var(--space-4) var(--space-5) var(--space-5);position:sticky;bottom:0;background:linear-gradient(transparent,var(--canvas) 18px)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lab{font:700 12px var(--font-sans)}
.inp{width:100%;min-height:var(--target-primary);padding:0 14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper);font:500 15px var(--font-sans);color:var(--ink)}
textarea.inp{padding:var(--space-3) 14px;min-height:96px;resize:vertical}

document.addEventListener("submit",function(e){e.preventDefault();var f=e.target;
  if(f.id==="f-login"){S.logged=true;say("Connecté");go(histStack.length&&histStack[histStack.length-1]==="historique"?"historique":"profil");}
  else if(f.id==="f-signup"){var a=document.getElementById("su-pw").value,b=document.getElementById("su-pw2").value,m=document.getElementById("su-mail").value;var er=document.getElementById("su-err");if(!/\S+@\S+\.\S+/.test(m)){er.textContent="Saisissez une adresse e-mail valide.";return;}if(a.length<8){er.textContent="Le mot de passe doit faire au moins 8 caractères.";return;}if(a!==b){er.textContent="Les deux mots de passe sont différents.";return;}S.logged=true;say("Compte créé");go("profil");}
  else if(f.id==="f-alert"){var k=f.querySelector("input[name=ak]:checked").value;S.alerts.unshift({pid:S.pid,kind:k==="seuil"?"Prix sous "+document.getElementById("al-thr").value+" FCFA":k==="baisse"?"Baisse de prix":"Retour en stock",st:"on"});say("Alerte créée");go("alertes");}
  else if(f.id==="f-pay"){var tot=cartTotal()+(S.reception==="delivery"?1000:0);S.orders.unshift({id:"C-"+(2042+S.orders.length),v:S.cart[0]?S.cart[0].v:"v1",items:cartCount(),total:tot,st:"prep",code:"R"+Math.floor(100+Math.random()*900)});S.cart=[];S.oi=0;go("paiement-ok");}
  else if(f.id==="f-dispute"){say("Signalement envoyé");go("support");}
  else if(f.id==="f-chat"){var v=document.getElementById("chat-in").value.trim();if(!v)return;var hit=PRODUCTS.filter(function(p){return v.toLowerCase().indexOf(p.name.split(" ")[0].toLowerCase())>=0;})[0];S.chat=(S.chat.length?S.chat:[["me","Où acheter le riz 5 kg le moins cher ?"],["bot","riz5"]]).concat([["me",v],["bot",hit?hit.id:"Je ne trouve pas ce produit dans l\'app. Essayez « riz », « huile », « sucre » ou « lait »."]]);render();var sc=document.getElementById("scr");sc.scrollTop=sc.scrollHeight;}
  else if(f.id==="f-merchant"){var n=document.getElementById("m-name").value.trim();if(!n){document.getElementById("m-err").textContent="Indiquez le nom de votre commerce.";return;}S.merchant={name:n,step:0};say("Demande envoyée");go("m-statut");}
  else if(f.id==="f-publish"){var pid=document.getElementById("pub-p").value,pr=parseInt(document.getElementById("pub-price").value.replace(/\D/g,""),10);if(!pr||pr<10){document.getElementById("pub-err").textContent="Saisissez un prix en FCFA, sans décimales.";return;}var med=minPrice(P(pid))||pr;S.myPrices.unshift({pid:pid,price:pr,st:"review",fresh:"fresh"});S.queue.unshift({pid:pid,price:pr,who:S.merchant.name||VENDORS.v1.name,src:"marchand",zone:"Libreville",dev:Math.round((pr-med)/med*100),ago:"à l\'instant",mine:true});say("Prix soumis : en revue");go("m-prix");}
  else if(f.id==="f-contrib"){var cp=document.getElementById("c-p").value,cv=parseInt(document.getElementById("c-price").value.replace(/\D/g,""),10);if(!cv){document.getElementById("c-err").textContent="Saisissez le prix vu, en FCFA.";return;}var md=minPrice(P(cp))||cv;S.contribs.unshift({pid:cp,price:cv,where:document.getElementById("c-where").value,st:"pending",when:"aujourd\'hui"});S.queue.unshift({pid:cp,price:cv,who:"Vous",src:"terrain",zone:S.zone,dev:Math.round((cv-md)/md*100),ago:"à l\'instant",contrib:true});say("Relevé envoyé : merci !");go("releves");}
});

/* ---------- Actions ---------- */
document.addEventListener("change",function(e){var t=e.target;if(t.id==="t-log"){S.logged=t.checked;render();}if(t.id==="t-off"){S.offline=t.checked;render();}if(t.id==="t-first"){S.first=t.checked;render();}if(t.id==="t-slow"){S.slow=t.checked;render();}if(t.dataset&&t.dataset.act==="pay"){S.pay=t.value;render();}});
document.addEventListener("keydown",function(e){var t=e.target;if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("role")==="button"&&t.tagName!=="BUTTON"){e.preventDefault();t.dispatchEvent(new MouseEvent("click",{bubbles:true}));}});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-go],[data-act]");if(!el)return;
  if(el.dataset.go){go(el.dataset.go);return;}
  var a=el.dataset.act,i=+el.dataset.i;
  switch(a){
    case "back":go(el.dataset.to&&!histStack.length?el.dataset.to:(histStack.pop()||el.dataset.to||"accueil"),true);break;
    case "zone":S.zone=el.dataset.z;render();break;
    case "cat":S.query=el.dataset.c;go("recherche");break;
    case "open":S.pid=el.dataset.pid;go("fiche");break;
    case "trust":S.oi=i;go("fiabilite");break;
    case "fav":var k=S.favs.indexOf(S.pid);if(k>=0){S.favs.splice(k,1);say("Retiré des favoris");}else{S.favs.push(S.pid);say("Ajouté aux favoris");}render();break;
    case "add":var ex=S.cart.filter(function(c){return c.pid===S.pid&&c.v===el.dataset.v;})[0];if(ex)ex.n++;else S.cart.push({pid:S.pid,v:el.dataset.v,n:1});say("Ajouté à ma liste · "+cartCount()+" article"+(cartCount()>1?"s":""));render();break;
    case "qty":S.cart[i].n+=+el.dataset.d;if(S.cart[i].n<=0)S.cart.splice(i,1);render();break;
    case "single":var Ls=listStats();if(Ls.single){S.cart.forEach(function(c){c.v=Ls.single.v;});say("Toute la liste chez "+VENDORS[Ls.single.v].name);}go("panier");break;
    case "optimize":S.cart.forEach(function(c){c.v=offersOf(P(c.pid)).best.v;});say("Chaque produit au moins cher");go("panier");break;
    case "reception":S.reception=el.dataset.m;render();break;
    case "pay-fail":S.orders.unshift({id:"C-"+(2042+S.orders.length),v:S.cart[0]?S.cart[0].v:"v1",items:cartCount(),total:cartTotal(),st:"failed",code:"—"});say("Paiement refusé : aucun débit effectué");go("commandes");break;
    case "track":S.oi=i;go("suivi");break;
    case "advance":(S.orders[S.oi]||S.orders[0]).st="ready";say("Votre commande est prête");render();break;
    case "picked":(S.orders[S.oi]||S.orders[0]).st="done";say("Commande récupérée. Merci !");render();break;
    case "dtype":S.dispute.type=el.dataset.t;render();break;
    case "reply":S.ticketReply=el.dataset.t;render();break;
    case "report":say("Signalement envoyé à la modération");render();break;
    case "favs-cart":S.favs.forEach(function(id){S.cart.push({pid:id,v:offersOf(P(id)).best.v,n:1});});say("Favoris ajoutés au panier");go("panier");break;
    case "budget-cart":S.cart=[{pid:"riz5",v:"v1",n:2},{pid:"huile1",v:"v2",n:3},{pid:"sucre1",v:"v1",n:2}];go("panier");break;
    case "alert-toggle":S.alerts[i].st=S.alerts[i].st==="paused"?"on":"paused";render();break;
    case "logout":S.logged=false;say("Déconnecté");render();break;
    case "verify":S.merchant.step=2;if(!S.merchant.name)S.merchant.name="Épicerie du Rond-Point";say("Commerce vérifié");render();break;
    case "confirm":S.myPrices[i].fresh="fresh";var pp=P(S.myPrices[i].pid);pp.offers.forEach(function(x){if(x.v==="v1"){x.fresh="fresh";x.age="aujourd\'hui";}});say("Prix confirmé : redevient « Récent »");render();break;
    case "edit-price":S.pid=S.myPrices[i].pid;go("m-publier");break;
    case "stock":S.stock[el.dataset.p]=el.dataset.k;P(el.dataset.p).offers.forEach(function(x){if(x.v==="v1")x.avail=el.dataset.k;});say("Disponibilité mise à jour");render();break;
    case "seg":el.parentNode.querySelectorAll("button").forEach(function(b){b.classList.remove("on");});el.classList.add("on");break;
    case "m-ready":S.orders.forEach(function(o){if(o.id===el.dataset.id)o.st="ready";});say("Client prévenu : commande prête");render();break;
    case "bo-pub":var q=S.queue.splice(i,1)[0],p=P(q.pid),vv=q.contrib?"v3":"v1",ex2=p.offers.filter(function(x){return x.v===vv;})[0];if(ex2){ex2.price=q.price;ex2.fresh="fresh";ex2.age="aujourd\'hui";ex2.avail="in";}else p.offers.push(o(vv,q.price,"fresh",q.contrib?"medium":"high","in","aujourd\'hui",q.contrib?"Relevé terrain":"Marchand"));S.myPrices.forEach(function(m){if(m.pid===q.pid&&m.st==="review"){m.st="published";m.price=q.price;}});S.contribs.forEach(function(c){if(c.pid===q.pid&&c.st==="pending")c.st="accepted";});say("Publié : visible dans la comparaison");render();break;
    case "bo-rej":var r=S.queue.splice(i,1)[0];S.myPrices.forEach(function(m){if(m.pid===r.pid&&m.st==="review")m.st="rejected";});S.contribs.forEach(function(c){if(c.pid===r.pid&&c.st==="pending"){c.st="rejected";c.why="Prix hors fourchette, merci de revérifier";}});say("Rejeté avec motif envoyé à l\'auteur");render();break;
    case "setzone":S.zone=el.dataset.z;S.first=false;say("Zone : "+S.zone);go("accueil");break;
    case "rebuy":var added=0;LASTWEEK.forEach(function(it){var p=P(it.pid),b=offersOf(p).best;if(!b)return;var ex=S.cart.filter(function(c){return c.pid===it.pid;})[0];if(ex)return;S.cart.push({pid:it.pid,v:b.v,n:it.n});added++;});say(added?added+" produit"+(added>1?"s":"")+" ajouté"+(added>1?"s":"")+" à ma liste":"Déjà dans ma liste");go("accueil");break;
    case "online":S.offline=false;render();break;
    case "toast":say(el.dataset.m);render();break;
    case "reset":try{localStorage.removeItem("comparo-proto");}catch(err){}location.hash="";location.reload();break;
  }
});
document.getElementById("navtoggle").addEventListener("click",function(){var o=nav.classList.toggle("open");this.setAttribute("aria-expanded",String(o));});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h&&h!==cur&&VALID[h])go(h);});
var h0=location.hash.slice(1);cur=VALID[h0]?h0:"accueil";render();
})();
</script>
