name: Flutter CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'design/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-dependency-path: pubspec.lock
      - run: flutter pub get --enforce-lockfile
      # Generated JSON models must match their sources.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build web --release --wasm --dart-define=API_BASE_URL=https://api.example.com
      - run: flutter build apk --debug
