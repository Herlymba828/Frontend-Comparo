<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer son profil marchand</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wf/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 11px/1 var(--font-mono);flex:none}
.f{display:flex;flex-direction:column;gap:6px}
.f input{height:44px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:15px var(--font-sans);background:var(--paper);color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-soft);">
    <a href="Profil.dc.html" aria-label="Retour" style="width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-soft); border-radius: 8px; font-size: 18px;">‹</a>
    <span class="title">Mon commerce</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px;">
    <div style="display: flex; gap: 8px; align-items: center;"><span class="n">1</span><span class="caption" style="color: var(--ink-muted);">Étape 1 sur 2 · Informations</span></div>
    <div class="f"><label class="label" for="nm">Nom commercial *</label><input id="nm" placeholder="Ex. Épicerie du carrefour"></div>
    <div class="f"><label class="label" for="ds">Description</label><input id="ds" placeholder="Ce que vous vendez"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div class="f"><label class="label" for="ph">Téléphone</label><input id="ph" inputmode="tel"></div>
      <div class="f"><label class="label" for="ml">E-mail</label><input id="ml" type="email"></div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;"><span class="n">2</span><div style="width: 56px; height: 56px; background: var(--fill-100); border-radius: 8px; flex: none;"></div><span class="caption" style="color: var(--ink-muted);">Logo : lien vers une image (pas d'envoi de fichier)</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px;">
      <div style="display: flex; gap: 8px; align-items: center;"><span class="n">3</span><span class="body" style="font-weight: 600; color: var(--ink-muted);">Étape 2 · Pièces justificatives</span></div>
      <span class="caption" style="color: var(--ink-muted);">RCCM, pièce d'identité du gérant… Non supporté par l'API aujourd'hui.</span>
    </div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-soft);">
    <div style="display: flex; gap: 8px; align-items: center;"><span class="n">4</span><span class="caption" style="color: var(--ink-muted);">Votre commerce sera vérifié avant publication.</span></div>
    <a href="MarchandStatut.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: var(--primary); color: var(--on-primary); border-radius: 8px; font-weight: 600;">Envoyer ma demande</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
