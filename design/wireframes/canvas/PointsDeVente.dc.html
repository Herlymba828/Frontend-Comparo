<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Points de vente</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/wf/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.ln{display:block;height:8px;border-radius:4px;background:var(--fill-200)}
.n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 11px/1 var(--font-mono);flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-sans);">
  <div style="display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-soft);">
    <a href="MarchandStatut.dc.html" aria-label="Retour" style="width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-soft); border-radius: 8px; font-size: 18px;">‹</a>
    <span class="title">Points de vente</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px;">
    <div style="display: flex; gap: 8px; align-items: center;"><span class="n">1</span><span class="caption" style="color: var(--ink-muted);">[N] points de vente</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 2px solid var(--ink); border-radius: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span class="body" style="font-weight: 600;">[Nom du point de vente]</span><span class="label" style="padding: 2px 8px; background: var(--primary); color: var(--on-primary); border-radius: 4px;">Principal</span></div>
      <span class="caption" style="color: var(--ink-muted);">[Rue] · [Ville] · [Zone]</span>
      <span class="ln" style="width: 55%;"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line-soft); border-radius: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span class="body" style="font-weight: 600;">[Nom du point de vente]</span><div style="display: flex; gap: 6px; align-items: center;"><span class="n">3</span><span class="caption" style="text-decoration: underline;">Définir principal</span></div></div>
      <span class="caption" style="color: var(--ink-muted);">[Rue] · [Ville] · [Zone]</span>
      <span class="ln" style="width: 40%;"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px dashed var(--line); border-radius: 8px;">
      <div style="display: flex; gap: 8px; align-items: center;"><span class="n">2</span><span class="body" style="font-weight: 600;">Nouveau point de vente</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Nom *</span><span style="height: 40px; border: 1px solid var(--line); border-radius: 8px;"></span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Rue *</span><span style="height: 40px; border: 1px solid var(--line); border-radius: 8px;"></span></div>
        <div style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Ville *</span><span style="height: 40px; border: 1px solid var(--line); border-radius: 8px;"></span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Zone</span><span style="height: 40px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px;">▾</span></div>
      <div style="height: 72px; background: var(--fill-100); border-radius: 8px; display: grid; place-items: center;"><span class="caption" style="color: var(--ink-muted);">Position sur la carte (latitude, longitude)</span></div>
    </div>
  </div>
  <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line-soft);">
    <a href="MesPrix.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: var(--primary); color: var(--on-primary); border-radius: 8px; font-weight: 600;">Enregistrer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
